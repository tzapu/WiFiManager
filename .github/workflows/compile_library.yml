name: Compile Library

on:
  push:
    paths-ignore:
      - '.github/workflows/cpp_lint.yml'
      - '.github/workflows/compile_examples.yaml'
      - 'examples/**'
  pull_request:
    paths-ignore:
      - '.github/workflows/cpp_lint.yml'
      - '.github/workflows/compile_examples.yaml'
      - 'examples/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core:
          - "esp32:esp32@3.1.0"

    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install ${{ matrix.core }}

      - name: Compile library
        run: |
          mkdir -p build
          printf '#include <Arduino.h>\n#include <WiFiManager.h>\nvoid setup() {}\nvoid loop() {}\n' > build/main.ino
          arduino-cli compile --fqbn esp32:esp32:esp32 --library . build
