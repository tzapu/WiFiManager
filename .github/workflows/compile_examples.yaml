name: Compile examples

on:
  push:
    paths-ignore:
      - '.github/workflows/cpp_lint.yml'
      - '.github/workflows/compile_library.yml'
  pull_request:
    paths-ignore:
      - '.github/workflows/cpp_lint.yml'
      - '.github/workflows/compile_library.yml'

jobs:
  esp32:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - "examples/Basic"
          - "examples/Advanced"
          - "examples/SecurePersistence"
          - "examples/NonBlocking/AutoConnectNonBlocking"
          - "examples/NonBlocking/AutoConnectNonBlockingwParams"
          - "examples/NonBlocking/OnDemandNonBlocking"

    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.1.0

      - name: Compile example
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --library . "${{ matrix.example }}"
